<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Turni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424; --border:#2e2e2e;
  --text:#f0f0f0; --text-muted:#888;
  --accent:#e8c547; --accent-dim:rgba(232,197,71,0.12);
  --sala:#4ab8e8; --sala-dim:rgba(74,184,232,0.13);
  --cucina:#e8804a; --cucina-dim:rgba(232,128,74,0.13);
  --pizzeria:#5de8a0; --pizzeria-dim:rgba(93,232,160,0.13);
  --taglieri:#c47be8; --taglieri-dim:rgba(196,123,232,0.13);
  --danger:#e85d4a; --success:#5de8a0; --warn:#e8c547;
  --radius:10px; --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;}
#app{display:none;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.header-brand{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 20px;overflow-x:auto;}
nav button{background:none;border:none;color:var(--text-muted);font-family:var(--sans);font-size:13px;font-weight:500;padding:14px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;}
nav button:hover{color:var(--text);}
nav button.active{color:var(--accent);border-bottom-color:var(--accent);}

/* MAIN */
main{max-width:1280px;margin:0 auto;padding:24px 20px;}
.section{display:none;}
.section.active{display:block;}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.week-label{font-family:var(--mono);font-size:12px;color:var(--text-muted);flex:1;text-align:center;min-width:160px;}
.week-label strong{display:block;font-size:15px;color:var(--text);margin-top:2px;}

/* DEPT FILTER */
.dept-filter{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.dept-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text-muted);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.dept-pill:hover{border-color:var(--accent);color:var(--text);}
.dept-pill.f-all{background:var(--accent);border-color:var(--accent);color:#000;}
.dept-pill.f-sala{background:var(--sala);border-color:var(--sala);color:#000;}
.dept-pill.f-cucina{background:var(--cucina);border-color:var(--cucina);color:#fff;}
.dept-pill.f-pizzeria{background:var(--pizzeria);border-color:var(--pizzeria);color:#000;}
.dept-pill.f-taglieri{background:var(--taglieri);border-color:var(--taglieri);color:#fff;}

/* WEEKLY GRID */
.week-grid{display:grid;grid-template-columns:130px repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;font-size:12px;}
.wg-header{background:var(--surface2);padding:8px 6px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;text-align:center;line-height:1.4;}
.wg-header.today-col{color:var(--accent);}
.wg-name{background:var(--surface);padding:9px 11px;display:flex;flex-direction:column;gap:3px;justify-content:center;}
.wg-name .emp-name{font-weight:600;font-size:12px;}
.wg-name .emp-dept{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;}
.wg-name.d-sala .emp-dept{color:var(--sala);}
.wg-name.d-cucina .emp-dept{color:var(--cucina);}
.wg-name.d-pizzeria .emp-dept{color:var(--pizzeria);}
.wg-name.d-taglieri .emp-dept{color:var(--taglieri);}
.wg-cell{background:var(--surface);padding:6px 5px;min-height:50px;display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center;}
.wg-cell.today-col{background:var(--accent-dim);}
.wg-name.over-hours{border-left:3px solid var(--danger);}
.wg-name.near-hours{border-left:3px solid var(--warn);}
.shift-tag{border-radius:4px;padding:3px 5px;font-size:10px;font-weight:500;line-height:1.3;text-align:center;width:100%;}
.shift-tag.sala{background:var(--sala-dim);color:var(--sala);border:1px solid rgba(74,184,232,.25);}
.shift-tag.cucina{background:var(--cucina-dim);color:var(--cucina);border:1px solid rgba(232,128,74,.25);}
.shift-tag.pizzeria{background:var(--pizzeria-dim);color:var(--pizzeria);border:1px solid rgba(93,232,160,.25);}
.shift-tag.taglieri{background:var(--taglieri-dim);color:var(--taglieri);border:1px solid rgba(196,123,232,.25);}
.shift-tag.off{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);font-size:9px;}

/* MONTHLY */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.month-label{font-family:var(--mono);font-size:16px;color:var(--text);text-transform:uppercase;letter-spacing:2px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-dow{background:var(--surface2);padding:9px 8px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;}
.cal-day{background:var(--surface);padding:7px;min-height:88px;cursor:pointer;transition:background .1s;}
.cal-day:hover{background:var(--surface2);}
.cal-day.empty{background:var(--bg);cursor:default;}
.cal-day.today{background:var(--accent-dim);}
.cal-day.today .cal-day-num{color:var(--accent);font-weight:700;}
.cal-day-num{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.cal-note-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
.cal-shifts-preview{display:flex;flex-direction:column;gap:2px;}
.cal-shift-dot{height:17px;border-radius:3px;display:flex;align-items:center;padding:0 5px;font-size:10px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cal-shift-dot.sala{background:var(--sala-dim);color:var(--sala);}
.cal-shift-dot.cucina{background:var(--cucina-dim);color:var(--cucina);}
.cal-shift-dot.pizzeria{background:var(--pizzeria-dim);color:var(--pizzeria);}
.cal-shift-dot.taglieri{background:var(--taglieri-dim);color:var(--taglieri);}
.cal-more{font-size:9px;color:var(--text-muted);margin-top:2px;}

/* DEPT SECTION */
.dept-section{margin-bottom:28px;}
.dept-section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.dept-section-title{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700;}
.dept-section-title.sala{color:var(--sala);}
.dept-section-title.cucina{color:var(--cucina);}
.dept-section-title.pizzeria{color:var(--pizzeria);}
.dept-section-title.taglieri{color:var(--taglieri);}
.dept-divider{flex:1;height:1px;background:var(--border);}

/* ADMIN GRID (turni per reparto) */
.admin-week-grid{display:grid;grid-template-columns:140px repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;font-size:12px;margin-bottom:4px;}
.awg-header{background:var(--surface2);padding:8px 6px;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;text-align:center;line-height:1.4;}
.awg-header.today-col{color:var(--accent);}
.awg-name{background:var(--surface);padding:8px 10px;font-weight:600;font-size:12px;display:flex;align-items:center;}
.awg-cell{background:var(--surface);padding:4px;min-height:52px;display:flex;align-items:center;justify-content:center;}
.awg-cell.today-col{background:var(--accent-dim);}
.awg-cell select{font-size:11px;padding:5px 6px;border-radius:6px;width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);cursor:pointer;}
.awg-cell select:focus{outline:none;border-color:var(--accent);}
.awg-cell select.has-shift{border-color:currentColor;}
.awg-cell select.shift-sala{color:var(--sala);border-color:rgba(74,184,232,.4);background:var(--sala-dim);}
.awg-cell select.shift-cucina{color:var(--cucina);border-color:rgba(232,128,74,.4);background:var(--cucina-dim);}
.awg-cell select.shift-pizzeria{color:var(--pizzeria);border-color:rgba(93,232,160,.4);background:var(--pizzeria-dim);}
.awg-cell select.shift-taglieri{color:var(--taglieri);border-color:rgba(196,123,232,.4);background:var(--taglieri-dim);}

/* CUSTOM TIME ROW */
.custom-time-row{display:none;gap:4px;align-items:center;margin-top:3px;padding:0 4px;}
.custom-time-row input{font-size:11px;padding:4px 5px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);width:68px;}
.custom-time-row .btn-save{font-size:10px;padding:4px 8px;background:var(--accent);color:#000;border:none;border-radius:5px;cursor:pointer;font-weight:700;}

/* PROFILE */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.profile-grid{grid-template-columns:1fr;}}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.profile-card-title{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px;}
.hours-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.hours-row:last-child{border-bottom:none;}
.hours-label{color:var(--text-muted);}
.hours-value{font-family:var(--mono);font-weight:700;}
.hours-value.over{color:var(--danger);}
.hours-value.near{color:var(--warn);}
.hours-value.ok{color:var(--success);}

/* ADMIN CARDS */
.admin-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.admin-cols{grid-template-columns:1fr;}}
.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.admin-card-title{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px;}
.shift-editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.shift-editor-title{font-size:15px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

/* FORMS */
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:10px;font-family:var(--mono);color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:14px;padding:9px 11px;width:100%;transition:border-color .15s;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
input::placeholder{color:var(--text-muted);}
select option{background:var(--surface2);}

/* BUTTONS */
.btn{border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{opacity:.85;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#000;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px;}
.btn-icon{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:5px;border-radius:6px;font-size:15px;transition:color .15s,background .15s;display:inline-flex;align-items:center;}
.btn-icon:hover{color:var(--text);background:var(--surface2);}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}

/* EMP LIST */
.emp-list{display:flex;flex-direction:column;gap:7px;}
.emp-item{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
.emp-item-info{display:flex;align-items:center;gap:10px;}
.emp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.emp-dot.sala{background:var(--sala);}
.emp-dot.cucina{background:var(--cucina);}
.emp-dot.pizzeria{background:var(--pizzeria);}
.emp-dot.taglieri{background:var(--taglieri);}
.emp-item-name{font-weight:500;font-size:13px;}
.emp-item-dept{font-size:10px;font-family:var(--mono);color:var(--text-muted);letter-spacing:1px;}
.emp-item-actions{display:flex;gap:4px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

/* DAY MODAL */
.day-dept-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:14px;margin-bottom:5px;color:var(--text-muted);}
.day-shift-list{display:flex;flex-direction:column;gap:5px;}
.day-shift-item{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-radius:7px;font-size:13px;}
.day-shift-item.sala{background:var(--sala-dim);border:1px solid rgba(74,184,232,.2);}
.day-shift-item.cucina{background:var(--cucina-dim);border:1px solid rgba(232,128,74,.2);}
.day-shift-item.pizzeria{background:var(--pizzeria-dim);border:1px solid rgba(93,232,160,.2);}
.day-shift-item.taglieri{background:var(--taglieri-dim);border:1px solid rgba(196,123,232,.2);}
.day-shift-name{font-weight:600;}
.day-shift-time{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.day-note-banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;}

/* PIN */
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);transition:background .15s,border-color .15s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:230px;margin:0 auto;}
.pin-key{background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:19px;padding:15px;cursor:pointer;text-align:center;transition:background .1s,transform .1s;user-select:none;}
.pin-key:hover{background:var(--surface);}
.pin-key:active{transform:scale(.95);background:var(--accent-dim);}

/* TAG BADGE */
.tag-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;}
.tag-badge.sala{background:var(--sala-dim);color:var(--sala);}
.tag-badge.cucina{background:var(--cucina-dim);color:var(--cucina);}
.tag-badge.pizzeria{background:var(--pizzeria-dim);color:var(--pizzeria);}
.tag-badge.taglieri{background:var(--taglieri-dim);color:var(--taglieri);}
.tag-badge.admin{background:var(--accent-dim);color:var(--accent);}

/* ALERTS */
.alert-banner{background:rgba(232,93,74,.1);border:1px solid rgba(232,93,74,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.warn-banner{background:rgba(232,197,71,.1);border:1px solid rgba(232,197,71,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--warn);display:flex;align-items:center;gap:8px;margin-bottom:12px;}

/* GATE (PIN lock screen) */
.gate-box{text-align:center;padding:48px 20px;}
.gate-box .gate-icon{font-size:42px;margin-bottom:16px;}
.gate-box h2{font-size:18px;font-weight:600;margin-bottom:8px;}
.gate-box p{color:var(--text-muted);font-size:14px;margin-bottom:24px;}

/* MISC */
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-muted);font-family:var(--mono);font-size:11px;letter-spacing:2px;gap:10px;}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:40px;color:var(--text-muted);font-size:13px;}
.section-title{font-size:19px;font-weight:600;margin-bottom:3px;}
.section-sub{color:var(--text-muted);font-size:13px;margin-bottom:22px;}
.divider{height:1px;background:var(--border);margin:20px 0;}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.success{border-color:var(--success);color:var(--success);}
#toast.error{border-color:var(--danger);color:var(--danger);}
@media(max-width:600px){
  .week-grid,.admin-week-grid{grid-template-columns:90px repeat(7,minmax(52px,1fr));}
  header{padding:0 12px;}
  main{padding:14px 12px;}
}
</style>
</head>
<body>

<!-- APP (aperta subito, no login) -->
<div id="app">
  <header>
    <div class="header-brand">🕐 Turni FTP</div>
  </header>
  <nav>
    <button class="active" onclick="switchTab('weekly')" id="tab-weekly">Settimana</button>
    <button onclick="switchTab('monthly')" id="tab-monthly">Mese</button>
    <button onclick="switchTab('reparti')" id="tab-reparti">Reparti</button>
    <button onclick="switchTab('monte-ore')" id="tab-monte-ore">Monte Ore 🔒</button>
    <button onclick="switchTab('admin')" id="tab-admin">Admin 🔒</button>
  </nav>
  <main>

    <!-- SETTIMANALE -->
    <div id="sec-weekly" class="section active">
      <div class="week-nav">
        <button class="btn btn-ghost btn-sm" onclick="moveWeek(-1)">← Prec</button>
        <div class="week-label"><span id="weekRangeLabel">—</span><strong id="weekYearLabel"></strong></div>
        <button class="btn btn-ghost btn-sm" onclick="moveWeek(1)">Succ →</button>
      </div>
      <div class="dept-filter" id="weeklyFilter"></div>
      <div id="hoursAlerts"></div>
      <div id="weeklyGrid" class="week-grid"><div class="loader" style="grid-column:1/-1"><div class="spin"></div></div></div>
    </div>

    <!-- MENSILE -->
    <div id="sec-monthly" class="section">
      <div class="month-nav">
        <button class="btn btn-ghost btn-sm" onclick="moveMonth(-1)">← Prec</button>
        <div class="month-label" id="monthLabel">—</div>
        <button class="btn btn-ghost btn-sm" onclick="moveMonth(1)">Succ →</button>
      </div>
      <div class="dept-filter" id="monthlyFilter"></div>
      <div class="cal-grid" id="calGrid"><div class="loader" style="grid-column:1/-1"><div class="spin"></div></div></div>
    </div>

    <!-- REPARTI -->
    <div id="sec-reparti" class="section">
      <div class="week-nav">
        <button class="btn btn-ghost btn-sm" onclick="moveWeekR(-1)">← Prec</button>
        <div class="week-label"><span id="weekRangeLabelR">—</span><strong id="weekYearLabelR"></strong></div>

<script>
// ═══════════════════════════════════════
// CONFIG

const SUPABASE_URL = 'https://dygmgzihlurnocljstzm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5Z21nemlobHVybm9jbGpzdHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzg1MzQsImV4cCI6MjA5NTgxNDUzNH0.icFP5kzz_zEzHKoiy2DDYhFObBi05ZgH0A8-B1dGz3Y';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ═══════════════════════════════════════
// COSTANTI

const DEPTS = ['sala','cucina','pizzeria','taglieri'];
const DEPT_LABELS = {sala:'Sala',cucina:'Cucina',pizzeria:'Pizzeria',taglieri:'Taglieri-Dolci'};
const DAYS_IT = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MONTHS_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const NOTE_CATEGORY_LABELS = {festa:'🎉 Festa',evento_sportivo:'⚽ Evento Sportivo',ricorrenza:'📅 Ricorrenza',evento_locale:'🏠 Evento Locale',altro:'📌 Altro'};
const CAL_START = new Date(2026,5,1);

// Orari predefiniti per reparto
const PRESET_SHIFTS = {
  sala:     [['06:00','15:00'],['08:00','17:00'],['17:00','23:00'],['19:00','01:00']],
  cucina:   [['10:30','15:00'],['18:30','23:00']],
  pizzeria: [['17:30','23:00']],
  taglieri: [['18:00','22:00']],
};

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const S = {
  employees:[], weekOffset:0, weekOffsetR:0, adminWeekOffset:0,
  monthDate: new Date(Math.max(new Date(), CAL_START)),
  deptFilter:'all', monthFilter:'all',
  adminUser:null, monteOreUser:null,
  editingNoteId:null,
  adminShifts:[], // shifts loaded for admin week
};
let pinBuffer='', pinModalTarget='';

// ═══════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════
function getMonday(d){const dt=new Date(d);const day=dt.getDay();dt.setDate(dt.getDate()+(day===0?-6:1-day));dt.setHours(0,0,0,0);return dt;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function toISO(d){return d.toISOString().split('T')[0];}
function todayDate(){const d=new Date();d.setHours(0,0,0,0);return d;}
function isToday(d){return toISO(new Date(d))===toISO(todayDate());}
function formatDate(d){return `${d.getDate()} ${MONTHS_IT[d.getMonth()].slice(0,3)}`;}
function getWeekDays(offset){const mon=getMonday(todayDate());mon.setDate(mon.getDate()+offset*7);return Array.from({length:7},(_,i)=>addDays(mon,i));}
function shiftHours(s){
  if(!s.start_time||!s.end_time||s.shift_type!=='work') return 0;
  const[sh,sm]=s.start_time.split(':').map(Number);
  const[eh,em]=s.end_time.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=1440;return mins/60;
}

// ═══════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════
async function loadEmployees(){
  const{data}=await sb.from('employees').select('*').order('dept').order('name');
  S.employees=data||[];
}
async function loadShiftsForRange(from,to){
  const{data,error}=await sb.from('shifts').select('*,employees(name,dept,role)').gte('date',from).lte('date',to).order('date').order('start_time');
  if(error){showToast('Errore turni','error');return[];}
  return data||[];
}
async function loadNotesForRange(from,to){
  const{data}=await sb.from('day_notes').select('*').gte('date',from).lte('date',to);
  return data||[];
}
async function loadAllNotes(){
  const{data}=await sb.from('day_notes').select('*').order('date');
  return data||[];
}

// ═══════════════════════════════════════
// PIN MODAL
// ═══════════════════════════════════════
function updatePinDots(){for(let i=0;i<4;i++)document.getElementById('pd'+i).classList.toggle('filled',i<pinBuffer.length);}
function openPinModal(target){
  pinModalTarget=target; pinBuffer=''; updatePinDots();
  document.getElementById('pinModalError').textContent='';
  if(target==='admin'){
    document.getElementById('pinModalTitle').textContent='🔒 Accesso Admin';
    const sel=document.getElementById('adminLoginSelect');
    document.getElementById('pinModalSub').textContent=sel.options[sel.selectedIndex]?.text||'';
  } else {
    document.getElementById('pinModalTitle').textContent='🔒 Monte Ore';
    const sel=document.getElementById('monteOreSelect');
    document.getElementById('pinModalSub').textContent=sel.options[sel.selectedIndex]?.text||'';
  }
  document.getElementById('pinModal').classList.add('open');
}
function closePinModal(){pinBuffer='';updatePinDots();document.getElementById('pinModal').classList.remove('open');}
function pinPress(key){
  if(key==='clr'){pinBuffer='';updatePinDots();document.getElementById('pinModalError').textContent='';return;}
  if(key==='del'){pinBuffer=pinBuffer.slice(0,-1);updatePinDots();return;}
  if(pinBuffer.length>=4) return;
  pinBuffer+=key;updatePinDots();
  if(pinBuffer.length===4) setTimeout(attemptPin,120);
}
async function attemptPin(){
  const errEl=document.getElementById('pinModalError');errEl.textContent='';
  const empId=pinModalTarget==='admin'
    ?document.getElementById('adminLoginSelect').value
    :document.getElementById('monteOreSelect').value;
  if(!empId){errEl.textContent='Seleziona il tuo nome.';pinBuffer='';updatePinDots();return;}
  const{data,error}=await sb.rpc('verify_employee_pin',{p_employee_id:empId,p_pin:pinBuffer});
  pinBuffer='';updatePinDots();
  if(error||!data){errEl.textContent='PIN errato. Riprova.';return;}
  const emp=S.employees.find(e=>e.id===empId);
  closePinModal();
  if(pinModalTarget==='admin'){
    if(emp.role!=='admin'){document.getElementById('pinModalError').textContent='Non sei un admin.';return;}
    S.adminUser=emp;
    sessionStorage.setItem('turni_admin',JSON.stringify(emp));
    showAdminContent();
  } else {
    S.monteOreUser=emp;
    sessionStorage.setItem('turni_monte_ore',JSON.stringify(emp));
    showMonteOreContent();
  }
}

// ═══════════════════════════════════════
// NAV
// ═══════════════════════════════════════
function switchTab(tab){
  ['weekly','monthly','reparti','monte-ore','admin'].forEach(t=>{
    document.getElementById('tab-'+t)?.classList.toggle('active',t===tab);
    document.getElementById('sec-'+t)?.classList.toggle('active',t===tab);
  });
  if(tab==='weekly') renderWeekly();
  if(tab==='monthly') renderMonthly();
  if(tab==='reparti') renderReparti();
  if(tab==='monte-ore'){
    const saved=sessionStorage.getItem('turni_monte_ore');
    if(saved&&!S.monteOreUser){try{const u=JSON.parse(saved);const f=S.employees.find(e=>e.id===u.id);if(f){S.monteOreUser=f;showMonteOreContent();}}catch(e){}}
    else if(S.monteOreUser){showMonteOreContent();}
  }
  if(tab==='admin'){
    const saved=sessionStorage.getItem('turni_admin');
    if(saved&&!S.adminUser){try{const u=JSON.parse(saved);const f=S.employees.find(e=>e.id===u.id);if(f&&f.role==='admin'){S.adminUser=f;showAdminContent();}}catch(e){}}
    else if(S.adminUser){showAdminContent();}
  }
}

// ═══════════════════════════════════════
// DEPT FILTERS
// ═══════════════════════════════════════
function buildDeptFilters(){
  ['weeklyFilter','monthlyFilter'].forEach((id,idx)=>{
    const mode=idx===0?'w':'m';
    document.getElementById(id).innerHTML=
      `<button class="dept-pill f-all" onclick="setFilter('all',this,'${mode}')">Tutti</button>`+
      DEPTS.map(d=>`<button class="dept-pill" onclick="setFilter('${d}',this,'${mode}')">${DEPT_LABELS[d]}</button>`).join('');
  });
}
function setFilter(dept,btn,mode){
  const id=mode==='w'?'weeklyFilter':'monthlyFilter';
  document.querySelectorAll(`#${id} .dept-pill`).forEach(b=>b.className='dept-pill');
  btn.classList.add(`f-${dept}`);
  if(mode==='w'){S.deptFilter=dept;buildWeeklyGrid(getWeekDays(S.weekOffset),window._wShifts||[],window._wNotes||[]);}
  else{S.monthFilter=dept;buildCalendar(S.monthDate,window._mShifts||[],window._mNotes||[]);}
}

// ═══════════════════════════════════════
// WEEKLY VIEW
// ═══════════════════════════════════════
async function renderWeekly(){
  const days=getWeekDays(S.weekOffset);
  updateWeekLabel(days,'weekRangeLabel','weekYearLabel');
  document.getElementById('weeklyGrid').innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin"></div></div>';
  const[shifts,notes]=await Promise.all([loadShiftsForRange(toISO(days[0]),toISO(days[6])),loadNotesForRange(toISO(days[0]),toISO(days[6]))]);
  window._wShifts=shifts;window._wNotes=notes;
  buildWeeklyGrid(days,shifts,notes);
}
function updateWeekLabel(days,rId,yId){
  document.getElementById(rId).textContent=`${formatDate(days[0])} — ${formatDate(days[6])}`;
  document.getElementById(yId).textContent=days[0].getFullYear();
}
function buildWeeklyGrid(days,shifts,notes){
  const filtered=S.deptFilter==='all'?S.employees:S.employees.filter(e=>e.dept===S.deptFilter);
  const grid=document.getElementById('weeklyGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1">Nessun dipendente</div>';return;}
  const alertsEl=document.getElementById('hoursAlerts');
  alertsEl.innerHTML='';
  filtered.forEach(emp=>{
    if(!emp.max_hours_per_week||emp.max_hours_per_week===0) return;
    const tot=shifts.filter(s=>s.employee_id===emp.id).reduce((a,s)=>a+shiftHours(s),0);
    const max=emp.max_hours_per_week;
    if(tot>max) alertsEl.innerHTML+=`<div class="alert-banner">⚠️ <strong>${emp.name}</strong> ha superato il monte ore: ${tot.toFixed(1)}h / ${max}h</div>`;
    else if(tot>=max*0.9) alertsEl.innerHTML+=`<div class="warn-banner">⏰ <strong>${emp.name}</strong> vicino al limite: ${tot.toFixed(1)}h / ${max}h</div>`;
  });
  let html='<div class="wg-header">Dipendente</div>';
  days.forEach(d=>{
    const isT=isToday(d);
    const dn=notes.filter(n=>n.date===toISO(d));
    const dot=dn.length?` <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${dn[0].color};vertical-align:middle;"></span>`:'';
    const lbl=d.getDay()===1?`Lunedì<br>${d.getDate()}`:DAYS_IT[d.getDay()]+'<br>'+d.getDate();
    html+=`<div class="wg-header${isT?' today-col':''}">${lbl}${dot}</div>`;
  });
  filtered.forEach(emp=>{
    const empShifts=shifts.filter(s=>s.employee_id===emp.id);
    const wt=empShifts.reduce((a,s)=>a+shiftHours(s),0);
    const max=emp.max_hours_per_week||0;
    let hc=''; if(max>0&&wt>max)hc=' over-hours'; else if(max>0&&wt>=max*0.9)hc=' near-hours';
    html+=`<div class="wg-name d-${emp.dept}${hc}"><span class="emp-name">${emp.name}</span><span class="emp-dept">${DEPT_LABELS[emp.dept]}</span>${wt>0?`<span style="font-size:9px;font-family:var(--mono);color:var(--text-muted);">${wt.toFixed(1)}h</span>`:''}</div>`;
    days.forEach(d=>{
      const iso=toISO(d);const isT=isToday(d);
      const ds=shifts.filter(s=>s.employee_id===emp.id&&s.date===iso);
      html+=`<div class="wg-cell${isT?' today-col':''}">`;
      if(!ds.length) html+=`<span class="shift-tag off">—</span>`;
      else ds.forEach(s=>{
        if(s.shift_type==='off') html+=`<span class="shift-tag off">Riposo</span>`;
        else if(s.shift_type==='holiday') html+=`<span class="shift-tag off">Ferie</span>`;
        else{const t=s.start_time&&s.end_time?`${s.start_time.slice(0,5)}–${s.end_time.slice(0,5)}`:s.start_time?.slice(0,5)||'—';html+=`<span class="shift-tag ${emp.dept}">${t}</span>`;}
      });
      html+='</div>';
    });
  });
  grid.innerHTML=html;
}
function moveWeek(dir){S.weekOffset+=dir;renderWeekly();}

// ═══════════════════════════════════════
// MONTHLY VIEW
// ═══════════════════════════════════════
async function renderMonthly(){
  if(S.monthDate<CAL_START) S.monthDate=new Date(CAL_START);
  const d=S.monthDate;
  document.getElementById('monthLabel').textContent=`${MONTHS_IT[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById('calGrid').innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin"></div></div>';
  const y=d.getFullYear(),m=d.getMonth();
  const from=`${y}-${String(m+1).padStart(2,'0')}-01`;
  const to=`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  const[shifts,notes]=await Promise.all([loadShiftsForRange(from,to),loadNotesForRange(from,to)]);
  window._mShifts=shifts;window._mNotes=notes;
  buildCalendar(d,shifts,notes);
}
function buildCalendar(d,shifts,notes){
  const y=d.getFullYear(),m=d.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const startOffset=firstDay===0?6:firstDay-1;
  let html='';
  ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(dd=>html+=`<div class="cal-dow">${dd}</div>`);
  for(let i=0;i<startOffset;i++) html+='<div class="cal-day empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isT=iso===toISO(todayDate());
    const dn=notes.filter(n=>n.date===iso);
    const ds=shifts.filter(s=>s.date===iso&&s.shift_type==='work');
    const filtered=S.monthFilter==='all'?ds:ds.filter(s=>s.employees?.dept===S.monthFilter);
    const more=filtered.length-3;
    const noteStyle=dn[0]?`border-top:2px solid ${dn[0].color};`:'';
    html+=`<div class="cal-day${isT?' today':''}" style="${noteStyle}" onclick="openDayModal('${iso}')">
      <div class="cal-day-num">${day}${dn.length?`<span class="cal-note-badge" style="background:${dn[0].color}22;color:${dn[0].color}">${NOTE_CATEGORY_LABELS[dn[0].category]?.split(' ')[0]||'📌'}</span>`:''}</div>
      <div class="cal-shifts-preview">`;
    filtered.slice(0,3).forEach(s=>{
      const name=s.employees?.name?.split(' ')[0]||'—';
      const dept=s.employees?.dept||'sala';
      html+=`<div class="cal-shift-dot ${dept}">${name}${s.start_time?' '+s.start_time.slice(0,5):''}</div>`;
    });
    if(more>0) html+=`<div class="cal-more">+${more} altri</div>`;
    html+='</div></div>';
  }
  document.getElementById('calGrid').innerHTML=html;
}
function moveMonth(dir){S.monthDate.setMonth(S.monthDate.getMonth()+dir);if(S.monthDate<CAL_START)S.monthDate=new Date(CAL_START);renderMonthly();}
function openDayModal(iso){
  const date=new Date(iso+'T00:00:00');
  document.getElementById('dayModalTitle').textContent=`${DAYS_IT[date.getDay()]} ${date.getDate()} ${MONTHS_IT[date.getMonth()]} ${date.getFullYear()}`;
  const shifts=(window._mShifts||[]).filter(s=>s.date===iso);
  const notes=(window._mNotes||[]).filter(n=>n.date===iso);
  let html='';
  notes.forEach(n=>html+=`<div class="day-note-banner" style="background:${n.color}18;border:1px solid ${n.color}44;color:${n.color};">${NOTE_CATEGORY_LABELS[n.category]||'📌'} ${n.text}</div>`);
  DEPTS.forEach(dept=>{
    const ds=shifts.filter(s=>s.employees?.dept===dept);
    if(!ds.length) return;
    html+=`<div class="day-dept-label">${DEPT_LABELS[dept]}</div><div class="day-shift-list">`;
    ds.forEach(s=>{
      const t=s.shift_type==='off'?'Riposo':s.shift_type==='holiday'?'Ferie':(s.start_time&&s.end_time?`${s.start_time.slice(0,5)} – ${s.end_time.slice(0,5)}`:s.start_time?.slice(0,5)||'—');
      html+=`<div class="day-shift-item ${dept}"><span class="day-shift-name">${s.employees?.name||'—'}</span><span class="day-shift-time">${t}</span></div>`;
    });

        const max=emp.max_hours_per_week||0;

        html+=`<div class="wg-name d-${dept}${hc}"><span class="emp-name">${emp.name}</span>${wt>0?`<span style="font-size:9px;font-family:var(--mono);color:var(--text-muted);">${wt.toFixed(1)}h</span>`:''}</div>`;
        days.forEach(d=>{
          const iso=toISO(d);const ds=shifts.filter(s=>s.employee_id===emp.id&&s.date===iso);
          html+=`<div class="wg-cell${isToday(d)?' today-col':''}">`;
          if(!ds.length) html+=`<span class="shift-tag off">—</span>`;

          });
          html+='</div>';
        });
      });

}

async function renderProfileForUser(empId){
  const emp=S.employees.find(e=>e.id===empId);
  const wrap=document.getElementById('monteOreProfileContent');
  if(!emp){wrap.innerHTML='';return;}
  wrap.innerHTML='<div class="loader"><div class="spin"></div></div>';
  const end=addDays(todayDate(),30);
  const start=new Date(todayDate());start.setMonth(start.getMonth()-5);start.setDate(1);
  const{data}=await sb.from('shifts').select('*').eq('employee_id',empId).eq('shift_type','work').gte('date',toISO(start)).lte('date',toISO(end)).order('date');
  const shifts=data||[];
  const byMonth={};shifts.forEach(s=>{const k=s.date.slice(0,7);if(!byMonth[k])byMonth[k]=[];byMonth[k].push(s);});
  const byWeek={};shifts.forEach(s=>{const d=new Date(s.date+'T00:00:00');const k=toISO(getMonday(d));if(!byWeek[k])byWeek[k]=[];byWeek[k].push(s);});
  const max=emp.max_hours_per_week||0;
  const tot=shifts.reduce((a,s)=>a+shiftHours(s),0);
  let html=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">
    <div class="emp-dot ${emp.dept}" style="width:12px;height:12px;"></div>
    <div><div style="font-size:17px;font-weight:600;">${emp.name}</div>
    <div style="font-size:12px;color:var(--text-muted);font-family:var(--mono);">${DEPT_LABELS[emp.dept]} ${max>0?`· max ${max}h/sett`:'· nessun limite'}</div></div>
    <div style="margin-left:auto;text-align:right;"><div style="font-family:var(--mono);font-size:20px;font-weight:700;">${tot.toFixed(0)}h</div><div style="font-size:11px;color:var(--text-muted);">ultimi 6 mesi</div></div>
  </div><div class="profile-grid">
  <div class="profile-card"><div class="profile-card-title">Ore per Mese</div>`;
  Object.keys(byMonth).sort().reverse().forEach(k=>{
    const[y,m]=k.split('-').map(Number);const t=byMonth[k].reduce((a,s)=>a+shiftHours(s),0);
    html+=`<div class="hours-row"><span class="hours-label">${MONTHS_IT[m-1]} ${y}</span><span class="hours-value ok">${t.toFixed(1)}h <span style="font-size:10px;color:var(--text-muted);">(${byMonth[k].length} turni)</span></span></div>`;
  });
  html+=`</div><div class="profile-card"><div class="profile-card-title">Ore per Settimana</div>`;
  Object.keys(byWeek).sort().reverse().slice(0,12).forEach(k=>{
    const t=byWeek[k].reduce((a,s)=>a+shiftHours(s),0);
    const d=new Date(k+'T00:00:00');
    let cls='ok';if(max>0&&t>max)cls='over';else if(max>0&&t>=max*0.9)cls='near';
    html+=`<div class="hours-row"><span class="hours-label">${formatDate(d)} – ${formatDate(addDays(d,6))}</span><span class="hours-value ${cls}">${t.toFixed(1)}h${max>0?` / ${max}h`:''}</span></div>`;
  });
  html+=`</div></div>`;
  wrap.innerHTML=html;
}

// Build admin grid with dropdown per cell
function buildAdminRepartiGrid(){
  const days=getWeekDays(S.adminWeekOffset);
  let html='';
  DEPTS.forEach(dept=>{
    const emps=S.employees.filter(e=>e.dept===dept);
    const presets=PRESET_SHIFTS[dept]||[];
    html+=`<div class="dept-section"><div class="dept-section-header"><div class="dept-section-title ${dept}">${DEPT_LABELS[dept]}</div><div class="dept-divider"></div></div>`;
    html+=`<div class="admin-week-grid">`;
    // header row
    html+=`<div class="awg-header">Dipendente</div>`;
    days.forEach(d=>{const lbl=d.getDay()===1?`Lunedì<br>${d.getDate()}`:DAYS_IT[d.getDay()]+'<br>'+d.getDate();html+=`<div class="awg-header${isToday(d)?' today-col':''}">${lbl}</div>`;});
    // employee rows
    emps.forEach(emp=>{
      html+=`<div class="awg-name">${emp.name}</div>`;
      days.forEach(d=>{
        const iso=toISO(d);const isT=isToday(d);
        const existing=S.adminShifts.find(s=>s.employee_id===emp.id&&s.date===iso);
        const cellId=`cell_${emp.id}_${iso}`;
        // Determine current value
        let curVal='';
        let selClass='';
        if(existing){
          if(existing.shift_type==='off') curVal='off';
          else if(existing.shift_type==='holiday') curVal='holiday';
          else if(existing.start_time&&existing.end_time){
            const key=`${existing.start_time.slice(0,5)}-${existing.end_time.slice(0,5)}`;
            const presetMatch=presets.find(p=>p[0]===existing.start_time.slice(0,5)&&p[1]===existing.end_time.slice(0,5));
            curVal=presetMatch?key:'custom';
          }
          if(curVal&&curVal!=='off'&&curVal!=='holiday') selClass=`shift-${dept}`;
        }
        // Build options
        let opts=`<option value="">— libero —</option>`;
        presets.forEach(p=>{const k=`${p[0]}-${p[1]}`;opts+=`<option value="${k}"${curVal===k?' selected':''}>${p[0]}–${p[1]}</option>`;});
        opts+=`<option value="off"${curVal==='off'?' selected':''}>Riposo</option>`;
        opts+=`<option value="holiday"${curVal==='holiday'?' selected':''}>Ferie</option>`;
        opts+=`<option value="custom"${curVal==='custom'?' selected':''}>✏️ Personalizzato</option>`;
        // Custom start/end values
        const cStart=existing&&existing.shift_type==='work'?existing.start_time?.slice(0,5)||'':'';
        const cEnd=existing&&existing.shift_type==='work'?existing.end_time?.slice(0,5)||'':'';
        const showCustom=curVal==='custom'?'flex':'none';
        html+=`<div class="awg-cell${isT?' today-col':''}" id="${cellId}">
          <div style="width:100%;">
            <select class="${selClass}" onchange="onShiftSelect(this,'${emp.id}','${iso}','${dept}')">${opts}</select>
            <div class="custom-time-row" id="ctr_${emp.id}_${iso}" style="display:${showCustom}">
              <input type="time" id="cs_${emp.id}_${iso}" value="${cStart}" placeholder="inizio">
              <span style="color:var(--text-muted);font-size:10px;">–</span>
              <input type="time" id="ce_${emp.id}_${iso}" value="${cEnd}" placeholder="fine">
              <button class="btn-save" onclick="saveCustomShift('${emp.id}','${iso}')">✓</button>
            </div>
          </div>
        </div>`;
      });
    });
    html+=`</div></div>`;
  });
  document.getElementById('adminRepartiGrid').innerHTML=html;
}

async function onShiftSelect(sel,empId,iso,dept){
  const val=sel.value;
  const ctrId=`ctr_${empId}_${iso}`;
  // Show/hide custom row
  document.getElementById(ctrId).style.display=val==='custom'?'flex':'none';
  if(val==='custom') return; // wait for save button
  // Update color class
  sel.className=val&&val!=='off'&&val!=='holiday'?`shift-${dept}`:'';
  if(!val){
    // Delete shift
    await sb.from('shifts').delete().eq('employee_id',empId).eq('date',iso);
    showToast('Turno rimosso','success');
  } else if(val==='off'||val==='holiday'){
    await upsertShift(empId,iso,{shift_type:val,start_time:null,end_time:null});
  } else {
    const[start,end]=val.split('-');
    await upsertShift(empId,iso,{shift_type:'work',start_time:start,end_time:end});
  }
  await loadAdminShifts();
  // refresh also public views cache
  window._wShifts=null;window._mShifts=null;
}
async function saveCustomShift(empId,iso){
  const start=document.getElementById(`cs_${empId}_${iso}`).value;
  const end=document.getElementById(`ce_${empId}_${iso}`).value;
  if(!start||!end){showToast('Inserisci inizio e fine','error');return;}
  if(start>=end&&!(parseInt(end)<parseInt(start))){/* allow overnight */}
  await upsertShift(empId,iso,{shift_type:'work',start_time:start,end_time:end});
  showToast('Turno salvato','success');
  await loadAdminShifts();
  buildAdminRepartiGrid();
}
async function upsertShift(empId,iso,fields){
  const existing=S.adminShifts.find(s=>s.employee_id===empId&&s.date===iso);
  const payload={employee_id:empId,date:iso,...fields};
  if(existing){
    const{error}=await sb.from('shifts').update(fields).eq('id',existing.id);
    if(error) showToast('Errore: '+error.message,'error');
  } else {
    const{error}=await sb.from('shifts').insert(payload);
    if(error) showToast('Errore: '+error.message,'error');
  }
}

  if(!date||!text){showToast('Inserisci data e testo','error');return;}
  const payload={date,category,color,text};
  const{error}=S.editingNoteId
    ?await sb.from('day_notes').update(payload).eq('id',S.editingNoteId)
    :await sb.from('day_notes').insert(payload);
  if(error){showToast('Errore: '+error.message,'error');return;}
  showToast(S.editingNoteId?'Nota aggiornata':'Nota salvata','success');resetNoteForm();loadNotesList();
}
async function loadNoteForEdit(id){
  const{data}=await sb.from('day_notes').select('*').eq('id',id).single();if(!data)return;
  S.editingNoteId=id;document.getElementById('noteDate').value=data.date;document.getElementById('noteCategory').value=data.category;
  document.getElementById('noteColor').value=data.color;document.getElementById('noteText').value=data.text;
  document.getElementById('deleteNoteBtn').style.display='inline-flex';
}
async function deleteNote(){if(S.editingNoteId)await deleteNoteById(S.editingNoteId);resetNoteForm();}
async function deleteNoteById(id){
  if(!confirm('Eliminare nota?')) return;
  await sb.from('day_notes').delete().eq('id',id);
  showToast('Nota eliminata','success');S.editingNoteId=null;document.getElementById('deleteNoteBtn').style.display='none';loadNotesList();
}
function resetNoteForm(){S.editingNoteId=null;document.getElementById('noteDate').value='';document.getElementById('noteText').value='';document.getElementById('noteColor').value='#e8c547';document.getElementById('deleteNoteBtn').style.display='none';}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function populateGateSelects(){
  const allOpts='<option value="">— seleziona —</option>'+S.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('monteOreSelect').innerHTML=allOpts;
  const adminOpts='<option value="">— seleziona —</option>'+S.employees.filter(e=>e.role==='admin').map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('adminLoginSelect').innerHTML=adminOpts;
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className=type?`show ${type}`:'show';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',2800);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
(async function init(){
  await loadEmployees();
  document.getElementById('app').style.display='block';
  buildDeptFilters();
  populateGateSelects();
  // Ripristina sessioni
  const savedAdmin=sessionStorage.getItem('turni_admin');
  const savedMo=sessionStorage.getItem('turni_monte_ore');
  if(savedAdmin){try{const u=JSON.parse(savedAdmin);const f=S.employees.find(e=>e.id===u.id);if(f&&f.role==='admin')S.adminUser=f;}catch(e){}}
  if(savedMo){try{const u=JSON.parse(savedMo);const f=S.employees.find(e=>e.id===u.id);if(f)S.monteOreUser=f;}catch(e){}}
  switchTab('weekly');
})();
</script>
